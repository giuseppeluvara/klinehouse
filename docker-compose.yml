services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  collector:
    build: .
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SYMBOLS: ${SYMBOLS:-BTCUSDT}
      KLINE_INTERVAL: ${KLINE_INTERVAL:-1s}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      BATCH_INTERVAL_SECONDS: ${BATCH_INTERVAL_SECONDS:-2}
      COMPRESSION_AFTER: ${COMPRESSION_AFTER:-7 days}
      RETENTION_PERIOD: ${RETENTION_PERIOD:-}
      WS_BASE_URL: ${WS_BASE_URL:-wss://stream.binance.com:9443}
      REST_BASE_URL: ${REST_BASE_URL:-https://api.binance.com}
      RECONNECT_MAX_BACKOFF: ${RECONNECT_MAX_BACKOFF:-60}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-10}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: ${POSTGRES_HOST:-timescaledb}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    healthcheck:
      test: ["CMD", "python", "-c",
        "import redis, os, time; r=redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.environ['REDIS_PORT'])); v=r.get('ingester:last_beat'); exit(0 if v and (time.time()-float(v))<60 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Grafana — order-flow & volatility radar over the analytics views.
  # Apply db/analytics.sql first so flow_metrics_1m / realized_vol_1m exist.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Passed through to datasource provisioning YAML
      POSTGRES_HOST:     ${POSTGRES_HOST:-timescaledb}
      POSTGRES_PORT:     ${POSTGRES_PORT:-5432}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Automated logical backups (opt-in): enable with
  #   docker compose --profile backup up -d
  # Dumps to ./backups every BACKUP_INTERVAL_SECONDS and keeps BACKUP_RETENTION
  # of them. Protects against volume deletion / disk failure (the named volume
  # already covers crashes & restarts).
  backup:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-timescaledb}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[backup] sidecar started: every $${BACKUP_INTERVAL_SECONDS}s -> /backups (retain $${BACKUP_RETENTION})";
        while true; do
          TS=$$(date -u +%Y%m%dT%H%M%SZ);
          OUT="/backups/klines_$${TS}.dump";
          echo "[backup] $$(date -u) dumping -> $$OUT";
          if pg_dump -Fc -f "$$OUT"; then
            echo "[backup] ok $$(du -h $$OUT | cut -f1)";
          else
            echo "[backup] FAILED"; rm -f "$$OUT";
          fi;
          ls -1t /backups/klines_*.dump 2>/dev/null | tail -n +$$((BACKUP_RETENTION + 1)) | xargs -r rm -f;
          sleep "$$BACKUP_INTERVAL_SECONDS";
        done

  # Opt-in archive worker. Independent of the collector, no automatic DB deletion.
  archive:
    build:
      context: .
      dockerfile: Dockerfile.storage
    profiles: ["archive"]
    restart: unless-stopped
    user: "${ARCHIVE_USER:-1000:1000}"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${ARCHIVE_ROOT:-./archive}:/archive

volumes:
  timescaledb_data:
  redis_data:
  grafana_data:
