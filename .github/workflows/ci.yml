name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    name: Lint & import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check --select E4,E7,E9,F src/ scripts/

      - name: Import check (no DB/Redis required)
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        run: python -c "from src import config; from src import ingester; from src import writer; from src import main; print('imports OK')"

  storage:
    name: Archive & Timescale integration
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: klines_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d klines_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://test:test@localhost:5432/klines_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install storage dependencies
        run: pip install -r requirements-storage.txt -r requirements-timestral-calibration.txt pytest ruff requests matplotlib==3.10.8
      - name: Lint storage code
        run: ruff check --select E4,E7,E9,F research/archive.py research/archive_backup.py research/market.py research/db.py research/timestral_experiment.py research/timestral_long_horizon.py research/timestral_adaptation.py research/timestral_repair.py research/timestral_diagnostics.py research/timestral_cadence.py research/timestral_capacity.py research/timestral_median.py research/timestral_funding.py research/timestral_history.py research/timestral_decomposition.py research/timestral_distribution.py research/timestral_microdirection.py research/timestral_reversal.py research/timestral_universal.py research/timestral_shared_trees.py tests/test_archive*.py tests/test_prune_safety.py tests/test_timestral*.py
      - name: Storage and real Timescale integration tests
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python -m pytest -q tests/test_archive*.py tests/test_prune_safety.py tests/test_timestral*.py
      - name: Lint adaptive direction experiments
        run: ruff check --select E4,E7,E9,F research/timestral_adaptive_direction.py research/timestral_adaptive_mixture.py research/timestral_adaptive_mixture_refined.py
      - name: Lint premium direction experiment
        run: ruff check --select E4,E7,E9,F research/timestral_premium_direction.py research/timestral_premium_direction_gaps.py
      - name: Verify saved forecast evidence without inference
        run: python reports/timestral-capacity-20261026/verify.py
      - name: Verify sign and variance research without fitting
        run: python scripts/verify_variance_research.py
      - name: Verify short-horizon direction evidence without fitting
        run: python scripts/verify_direction_research.py
      - name: Verify shared direction and older-cohort replications
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python scripts/verify_universal_direction.py
          python scripts/verify_history_portable.py
      - name: Verify causal adaptive calibration and expert mixtures
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python scripts/verify_adaptive_direction.py
          python scripts/verify_adaptive_mixture.py
      - name: Verify new premium information without fitting
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python scripts/verify_premium_direction.py
      - name: Lint futures flow experiment
        run: ruff check --select E4,E7,E9,F research/timestral_futures_flow.py
      - name: Verify futures volume and aggressor-flow evidence without fitting
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python scripts/verify_futures_flow.py
      - name: Lint recurring-regime direction experiment
        run: ruff check --select E4,E7,E9,F research/timestral_regime_direction.py
      - name: Verify recurring regimes and drift diagnosis without fitting
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python scripts/verify_regime_direction.py
      - name: Lint one-coefficient direction experiments
        run: ruff check --select E4,E7,E9,F research/timestral_simple_direction.py research/timestral_market_reversal.py
      - name: Verify simple relative and common-market reversal without fitting
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python scripts/verify_simple_direction.py
          python scripts/verify_market_reversal.py
      - name: Lint scalar market calibration experiments
        run: ruff check --select E4,E7,E9,F research/timestral_market_calibration.py research/timestral_uncertain_market.py
      - name: Verify prequential calibration and coefficient uncertainty without fitting
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          python scripts/verify_market_calibration.py
          python scripts/verify_uncertain_market.py
